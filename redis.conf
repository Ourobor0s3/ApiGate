# ApiGate local Redis config
# Start from the repo root so persistence files land there:
#   redis-server redis.conf
# (dump.rdb and appendonlydir/ are gitignored.)

bind 127.0.0.1
port 6379
daemonize yes

# Durability: survive Redis restarts so stored secrets/settings are not lost.
save 60 1
appendonly yes
appendfsync everysec
